<script>

// ======================================
// EDIT YOUR VIDEO LINKS HERE
// Supports Google Drive, Facebook,
// and YouTube.
// ======================================

const VIDEO_LINKS = [
  "https://drive.google.com/file/d/1sFAksFAxeowkLONLjn9u2rNVgYMu6FAw/preview",
  "https://drive.google.com/file/d/1J-uFXZ0FwT1E-WSwAv15j7IQouKRoA-j/preview",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  "",
  ""
];

// ======================================
// VIDEO EMBED CONVERTER
// ======================================

function embedUrl(link) {
  try {
    const u = new URL(link);
    const host = u.hostname.toLowerCase();

    // GOOGLE DRIVE
    if (host === "drive.google.com") {
      const match = u.pathname.match(
        /\/file\/d\/([^/]+)/
      );

      const id = match
        ? match[1]
        : u.searchParams.get("id");

      if (id) {
        return (
          "https://drive.google.com/file/d/" +
          encodeURIComponent(id) +
          "/preview"
        );
      }
    }

    // FACEBOOK
    if (
      host === "facebook.com" ||
      host.endsWith(".facebook.com") ||
      host === "fb.watch"
    ) {
      return (
        "https://www.facebook.com/plugins/video.php?href=" +
        encodeURIComponent(link) +
        "&show_text=false"
      );
    }

    // YOUTUBE SHORT LINKS
    if (host === "youtu.be") {
      const id = u.pathname
        .slice(1)
        .split("/")[0];

      if (id) {
        return (
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(id)
        );
      }
    }

    // YOUTUBE STANDARD LINKS
    if (
      host === "youtube.com" ||
      host.endsWith(".youtube.com")
    ) {
      const id =
        u.searchParams.get("v") ||
        (
          u.pathname.match(
            /^\/(?:shorts|embed|live)\/([^/]+)/
          ) || []
        )[1];

      if (id) {
        return (
          "https://www.youtube-nocookie.com/embed/" +
          encodeURIComponent(id)
        );
      }
    }

  } catch (error) {
    console.error("Invalid video URL:", link);
  }

  return "";
}

// ======================================
// CREATE ALL 12 VIDEO CARDS
// ======================================

const gallery = document.getElementById("gallery");

VIDEO_LINKS.slice(0, 12).forEach((link, index) => {

  const number = String(index + 1).padStart(2, "0");

  const card = document.createElement("article");
  card.className = "video-card";

  const frame = document.createElement("div");
  frame.className = "video-frame";

  const videoSrc = link ? embedUrl(link.trim()) : "";

  if (videoSrc) {

    const iframe = document.createElement("iframe");

    iframe.src = videoSrc;
    iframe.title = "AI Creative Video " + number;
    iframe.loading = "lazy";

    iframe.allow =
      "autoplay; clipboard-write; encrypted-media; " +
      "picture-in-picture; web-share";

    iframe.allowFullscreen = true;

    iframe.style.width = "100%";
    iframe.style.height = "100%";
    iframe.style.border = "0";

    frame.appendChild(iframe);

  } else {

    const placeholder = document.createElement("div");
    placeholder.className = "video-empty";

    const icon = document.createElement("b");
    icon.textContent = "\u25B6";

    const title = document.createElement("strong");
    title.textContent = "Video " + number;

    const hint = document.createElement("small");
    hint.textContent = "Add your video link in VIDEO_LINKS";

    placeholder.append(icon, title, hint);
    frame.appendChild(placeholder);

  }

  const heading = document.createElement("h3");
  heading.textContent = "Video " + number;

  const description = document.createElement("p");
  description.textContent =
    "AI UGC \u00B7 2D/3D \u00B7 Medical CGI";

  card.append(frame, heading, description);
  gallery.appendChild(card);

});

</script>

</body>
